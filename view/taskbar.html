<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folia Taskbar Lyrics Drawer</title>
  <link rel="stylesheet" href="taskbar.css">
</head>
<body>
  <!-- mods/taskbar-lyrics/view/taskbar.html: Drawer replacement view for Windows taskbar -->
  <div id="appRoot" class="app-root collapsed">
    <!-- Left Replacement Toggle Button (Always visible on far-left) -->
    <button id="toggleButton" class="toggle-button" type="button" title="点击展开/收起任务栏歌词抽屉" aria-label="切换歌词抽屉">
      <div class="toggle-icon-container">
        <div class="equalizer-bars" aria-hidden="true">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
        </div>
        <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
    </button>

    <!-- Drawer Content Panel (Slides from Right to Left to replace taskbar) -->
    <div id="drawerPanel" class="drawer-panel" aria-live="polite">
      <!-- Folia Lyrics Stage Fluid Cover Background -->
      <div class="drawer-bg-container" id="drawerBgContainer">
        <div class="drawer-cover-bg-wrap">
          <img id="drawerCoverBg" class="drawer-cover-bg" src="" alt="" aria-hidden="true" />
        </div>
        <div class="drawer-cover-overlay"></div>
        <div class="drawer-bg-acrylic"></div>
      </div>
      <div class="drawer-highlight-edge"></div>

      <!-- Left Song Meta & Cover -->
      <div class="song-meta-section">
        <div class="cover-container" id="coverContainer">
          <img id="coverImg" class="cover-image" src="" alt="Album Cover" />
          <div class="cover-fallback" id="coverFallback" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="3.5"></circle>
            </svg>
          </div>
          <div class="cover-glow"></div>
        </div>
        <div class="meta-texts">
          <div id="songTitle" class="song-title">等待播放</div>
          <div id="songArtist" class="song-artist">Folia</div>
        </div>
      </div>

      <!-- Center Lyrics Display Area -->
      <div class="lyrics-stage-section">
        <div class="lyrics-row primary-row">
          <div id="lyricMain" class="lyric-main">♪ 享受纯净旋律 ♪</div>
        </div>
        <div class="lyrics-row secondary-row">
          <div id="lyricSub" class="lyric-sub"></div>
        </div>
      </div>

      <!-- Right Playback Controls & Progress Bar -->
      <div class="controls-section">
        <!-- Interactive Progress Bar -->
        <div class="progress-container">
          <span id="timeCurrent" class="time-label">0:00</span>
          <div id="progressBar" class="progress-track" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressFill" class="progress-fill"></div>
            <div id="progressThumb" class="progress-thumb"></div>
          </div>
          <span id="timeDuration" class="time-label">0:00</span>
        </div>

        <!-- Action Buttons -->
        <div class="buttons-group">
          <button id="prevBtn" class="action-btn" type="button" title="上一首">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <polygon points="19 20 9 12 19 4 19 20"></polygon>
              <line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
            </svg>
          </button>
          <button id="playPauseBtn" class="action-btn play-pause-btn" type="button" title="播放/暂停">
            <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <rect x="6" y="4" width="4" height="16" rx="1"></rect>
              <rect x="14" y="4" width="4" height="16" rx="1"></rect>
            </svg>
          </button>
          <button id="nextBtn" class="action-btn" type="button" title="下一首">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <polygon points="5 4 15 12 5 20 5 4"></polygon>
              <line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"></line>
            </svg>
          </button>
          <button id="menuBtn" class="action-btn menu-btn" type="button" title="播放列表与设置" aria-label="播放列表与设置">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"></line>
              <line x1="8" y1="12" x2="21" y2="12"></line>
              <line x1="8" y1="18" x2="21" y2="18"></line>
              <line x1="3" y1="6" x2="3.01" y2="6"></line>
              <line x1="3" y1="12" x2="3.01" y2="12"></line>
              <line x1="3" y1="18" x2="3.01" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="taskbar.js"></script>
</body>
</html>
