<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folia Taskbar Menu</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <!-- mods/taskbar-lyrics/view/menu.html: Floating acrylic menu with play queue, online search, album/artist explore, and saved/recent lists -->
  <div id="menuRoot" class="menu-root">
    <!-- Top Header: 4 Public-API Tabs -->
    <div class="menu-header">
      <div id="menuTabs" class="menu-tabs" role="tablist" aria-label="快捷面板导航">
        <button class="menu-tab active" type="button" role="tab" data-tab="queue" aria-selected="true">队列</button>
        <button class="menu-tab" type="button" role="tab" data-tab="search" aria-selected="false">搜索</button>
        <button class="menu-tab" type="button" role="tab" data-tab="explore" aria-selected="false">探索</button>
        <button class="menu-tab" type="button" role="tab" data-tab="saved" aria-selected="false">收藏</button>
      </div>
    </div>

    <!-- Main Content Viewport -->
    <div class="content-viewport">
      <!-- Dynamic Top Toolbar (Pagination / Search Box / Explore Nav / Saved Controls) -->
      <div id="viewToolbar" class="view-toolbar"></div>

      <!-- Optional Subbar (Provider Chips for Search, Sub-tabs for Saved/Recent) -->
      <div id="viewSubbar" class="view-subbar hidden"></div>

      <!-- Scrollable Content Container -->
      <div id="viewContainer" class="view-container"></div>
    </div>

    <!-- Bottom Controls Area: Mode, Shuffle, Display Switch, Volume -->
    <div class="menu-footer">
      <div class="mode-row">
        <button id="lyricsToggleBtn" class="mode-btn lyrics-eye-btn" type="button" aria-pressed="true" aria-label="显示/隐藏任务栏歌词" title="点击隐藏任务栏歌词（仅显示歌名与作者）">
          <svg id="lyricsEyeIcon" class="mode-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
          <svg id="lyricsEyeOffIcon" class="mode-svg hidden" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
        <button id="loopModeBtn" class="mode-btn" type="button" title="切换播放模式 (列表循环 / 单曲循环 / 顺序播放)">
          <svg id="loopIconAll" class="mode-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <svg id="loopIconOne" class="mode-svg hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            <text x="12" y="15" font-size="8" font-weight="bold" fill="currentColor" text-anchor="middle">1</text>
          </svg>
          <svg id="loopIconOff" class="mode-svg hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
          </svg>
          <span id="loopModeLabel" class="mode-label">列表循环</span>
        </button>
        <button id="shuffleBtn" class="mode-btn shuffle-btn" type="button" title="随机打乱播放队列">
          <svg class="mode-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span class="mode-label">打乱</span>
        </button>
        <button id="displaySwitchBtn" class="mode-btn display-switch-btn" type="button" title="切换任务栏歌词所在显示器">
          <svg class="mode-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span id="displaySwitchLabel" class="mode-label">主屏</span>
        </button>
      </div>

      <!-- Lyric Timeline Offset Row (Mod-owned per-song adjustment + global setting sum) -->
      <div class="offset-row">
        <span class="offset-title" title="任务栏歌词独立时间轴偏移（正数让歌词更晚出现，全局偏移可在模组设置中调整）">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <polyline points="12 7 12 12 15.5 14"></polyline>
          </svg>
          <span>歌词偏移</span>
        </span>
        <div class="offset-controls">
          <button id="offsetMinusBtn" class="offset-step-btn" type="button" title="当前曲目歌词提前 200ms">-0.2s</button>
          <button id="offsetResetBtn" class="offset-value-btn" type="button" title="点击重置当前曲目偏移">0ms</button>
          <button id="offsetPlusBtn" class="offset-step-btn" type="button" title="当前曲目歌词延后 200ms">+0.2s</button>
        </div>
      </div>

      <!-- Volume Slider -->
      <div class="volume-row">
        <button id="muteBtn" class="volume-icon-btn" type="button" title="静音切换">
          <svg id="volumeHighIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="volumeMuteIcon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <div class="volume-slider-wrapper">
          <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="100" aria-label="应用音量" />
        </div>
        <span id="volumePercent" class="volume-percent">100%</span>
      </div>
    </div>
  </div>

  <script src="menu.js"></script>
</body>
</html>
