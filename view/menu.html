<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folia Taskbar Menu</title>
  <link rel="stylesheet" href="menu.css">
</head>
<body>
  <!-- mods/taskbar-lyrics/view/menu.html: Floating acrylic menu with unified breadcrumb navigation (书库 > 歌单 > 具体歌单 > 列表), play queue, and controls -->
  <div id="menuRoot" class="menu-root">
    <!-- Top Header: Breadcrumbs Navigation Bar (书库 > 歌单 > 具体歌单 > 列表) & Close Button -->
    <div class="menu-header">
      <div class="header-nav-bar">
        <button id="navBackBtn" class="nav-back-btn hidden" type="button" title="返回上一级">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <div id="navCrumbs" class="nav-crumbs">
          <span class="crumb active" data-depth="0">书库</span>
        </div>
      </div>
      <button id="closeBtn" class="close-btn" type="button" title="关闭菜单">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Main Content Viewport -->
    <div class="content-viewport">
      <!-- Dynamic Top Toolbar (Pagination / Search / Info Badges) -->
      <div id="viewToolbar" class="view-toolbar hidden">
        <!-- Dynamically populated per view level -->
      </div>

      <!-- Scrollable Content Container -->
      <div id="viewContainer" class="view-container">
        <!-- Dynamically rendered:
             - Root: 书库 Categories (播放队列, 歌单, 电台, 专辑, 本地音乐)
             - Category list: 歌单列表, 专辑列表, 电台入口
             - Songs list: 歌曲列表 (播放队列, 歌单内歌曲, 专辑内歌曲)
        -->
      </div>
    </div>

    <!-- Bottom Controls Area: Mode, Shuffle, Volume -->
    <div class="menu-footer">
      <div class="mode-row">
        <button id="loopModeBtn" class="mode-btn" type="button" title="切换播放模式 (列表循环 / 单曲循环 / 顺序播放)">
          <svg id="loopIconAll" class="mode-svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <svg id="loopIconOne" class="mode-svg hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            <text x="12" y="15" font-size="8" font-weight="bold" fill="currentColor" text-anchor="middle">1</text>
          </svg>
          <svg id="loopIconOff" class="mode-svg hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
            <line x1="2" y1="2" x2="22" y2="22" stroke="currentColor" stroke-width="2"></line>
          </svg>
          <span id="loopModeLabel" class="mode-label">列表循环</span>
        </button>
        <button id="shuffleBtn" class="mode-btn shuffle-btn" type="button" title="随机打乱播放队列">
          <svg class="mode-svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"></polyline>
            <line x1="4" y1="20" x2="21" y2="3"></line>
            <polyline points="21 16 21 21 16 21"></polyline>
            <line x1="15" y1="15" x2="21" y2="21"></line>
            <line x1="4" y1="4" x2="9" y2="9"></line>
          </svg>
          <span class="mode-label">打乱</span>
        </button>
      </div>

      <!-- Volume Slider -->
      <div class="volume-row">
        <button id="muteBtn" class="volume-icon-btn" type="button" title="静音切换">
          <svg id="volumeHighIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="volumeMuteIcon" class="hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <div class="volume-slider-wrapper">
          <input id="volumeSlider" class="volume-slider" type="range" min="0" max="100" value="100" aria-label="应用音量" />
        </div>
        <span id="volumePercent" class="volume-percent">100%</span>
      </div>
    </div>
  </div>

  <script src="menu.js"></script>
</body>
</html>
